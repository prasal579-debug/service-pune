<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Booking</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: #f4f7f6; padding: 20px; }
        .booking-card { background: #fff; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h3 { color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-submit { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: #0056b3; }
        #statusMessage { display: none; margin-top: 15px; padding: 12px; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; border-radius: 5px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="booking-card">
    <h3>नवीन बुकिंग करा</h3>
    
    <form id="bookingForm" onsubmit="submitBooking(event)">
        <div class="form-group">
            <label>कामाचा प्रकार निवडा</label>
            <select required>
                <option value="">निवडा...</option>
                <option value="Plumbing">Plumbing (नळ दुरुस्ती)</option>
                <option value="Electrician">Electrician (इलेक्ट्रिशियन)</option>
                <option value="Painter">Painter (कलर काम)</option>
                <option value="Housekeeper">Housekeeper (घरची स्वच्छता)</option>
            </select>
        </div>

        <div class="form-group">
            <label>पुण्यातील एरिया निवडा</label>
            <select required>
                <option value="">एरिया निवडा...</option>
                <option value="Swargate">Swargate</option>
                <option value="Katraj">Katraj</option>
                <option value="Shivaji Nagar">Shivaji Nagar</option>
                <option value="Kothrud">Kothrud</option>
                <option value="Hadapsar">Hadapsar</option>
                <option value="Deccan">Deccan</option>
            </select>
        </div>

        <div class="form-group">
            <label>तारीख आणि वेळ</label>
            <input type="datetime-local" required>
        </div>

        <div class="form-group">
            <label>कामाचा फोटो अपलोड करा</label>
            <input type="file" accept="image/*" required>
        </div>

        <div class="form-group">
            <label>तुम्ही देणारे पेमेंट (₹ मध्ये)</label>
            <input type="number" placeholder="उदा. 300" min="50" required>
        </div>

        <button type="submit" class="btn-submit">बुकिंग सबमिट करा</button>
    </form>

    <div id="statusMessage">
        Your appointment is confirmed!
    </div>
</div>

<script>
    function submitBooking(e) {
        e.preventDefault();
        // रिअल प्रोजेक्टमध्ये हा डेटा डेटाबेसमध्ये सेव्ह केला जाईल
        document.getElementById('statusMessage').style.display = 'block';
    }
</script>

</body>
</html>
