<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharkam.com - Secure Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("PfAaODZ_GPiBPHvOi"); 
        })();
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .hero-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="hero-bg min-h-screen flex flex-col justify-between text-gray-800">

    <header class="w-full py-4 px-6 flex justify-between items-center bg-white/10 backdrop-blur-md border-b border-white/20">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-2 rounded-full shadow-lg font-bold text-blue-600 text-xl">🏠 GK</div>
            <div>
                <h1 class="text-white text-2xl font-bold">GHARKAM<span class="text-yellow-400">.com</span></h1>
                <p class="text-xs text-blue-200">Pune City Services</p>
            </div>
        </div>
        <div>
            <span id="location-status" class="text-xs bg-yellow-400 text-gray-900 px-3 py-1.5 rounded-full font-semibold shadow-inner">📍 Pune Verified</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="max-w-md w-full glass-card p-8">
            
            <div class="flex mb-6 bg-gray-200 p-1 rounded-xl">
                <button onclick="setRole('customer')" id="tabCustomer" class="flex-1 py-2 text-sm font-bold rounded-lg bg-blue-600 text-white transition">Customer</button>
                <button onclick="setRole('worker')" id="tabWorker" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-700 transition">Worker</button>
            </div>

            <div class="text-center mb-6">
                <h2 id="formTitle" class="text-2xl font-bold text-gray-800">Customer Signup</h2>
                <p id="formSub" class="text-xs text-gray-500 mt-1">Create account using Email OTP</p>
            </div>

            <div id="statusMsg" class="hidden mb-4 p-3 rounded-xl text-center text-xs font-semibold"></div>

            <form id="authForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mobile Number:</label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <div id="emailContainer">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Email ID:</label>
                    <input type="email" id="email" placeholder="E.g., name@gmail.com" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                </div>

                <div id="passwordContainer">
                    <div class="flex justify-between items-center mb-1">
                        <label id="passLabel" class="block text-xs font-semibold text-gray-600">Password:</label>
                        <a href="#" id="forgotPassBtn" onclick="switchToForgotPassMode()" class="text-xs text-blue-600 hover:underline font-semibold hidden">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" minlength="6" placeholder="Enter Password (min 6 chars)" class="w-full p-3 pr-10 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        <button type="button" onclick="togglePasswordVisibility('password', 'eyeIcon1')" class="absolute right-3 top-3 text-gray-500 text-sm">
                            <span id="eyeIcon1">👁️</span>
                        </button>
                    </div>
                </div>

                <div id="confirmPasswordContainer">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Confirm Password:</label>
                    <div class="relative">
                        <input type="password" id="confirmPassword" minlength="6" placeholder="Re-enter Password" class="w-full p-3 pr-10 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                        <button type="button" onclick="togglePasswordVisibility('confirmPassword', 'eyeIcon2')" class="absolute right-3 top-3 text-gray-500 text-sm">
                            <span id="eyeIcon2">👁️</span>
                        </button>
                    </div>
                </div>

                <div id="workTypeContainer" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Work Expertise:</label>
                    <select id="workType" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-yellow-500 outline-none text-sm bg-white">
                        <option value="Cleaning">Cleaning</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Painting">Painting</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition duration-300">
                    Send OTP
                </button>

                <div id="otpContainer" class="hidden space-y-3 pt-3 border-t">
                    <label class="block text-xs font-semibold text-blue-600">Enter OTP sent to your Email:</label>
                    <div class="flex space-x-2">
                        <input type="text" id="otpInput" placeholder="6-digit OTP" class="flex-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono text-center">
                        <button type="button" id="verifyBtn" onclick="verifyOTPAndRegister(event)" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 rounded-xl text-xs transition">Verify & Proceed</button>
                    </div>

                    <div class="flex justify-between items-center text-xs pt-1">
                        <button type="button" onclick="resendOTP()" id="resendBtn" class="text-blue-600 hover:underline font-semibold">🔄 Resend OTP</button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-6">
                <p id="toggleText" class="text-xs text-gray-600">
                    Already have an account? <a href="#" onclick="toggleMode('signin')" class="text-blue-600 font-bold hover:underline">Sign In</a>
                </p>
            </div>

        </div>
    </main>

    <footer class="text-center py-4 text-blue-200 text-xs bg-black/20">
        &copy; 2026 Gharkam.com | Pune City
    </footer>

    <script>
        let currentRole = 'customer'; 
        let currentMode = 'signup'; // 'signup', 'signin', 'forgot'
        let generatedOTP = null;
        let pendingUserData = null;

        function setRole(role) {
            currentRole = role;
            const tabC = document.getElementById('tabCustomer');
            const tabW = document.getElementById('tabWorker');

            if (role === 'customer') {
                tabC.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-blue-600 text-white transition";
                tabW.className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-700 transition";
            } else {
                tabW.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-yellow-500 text-gray-900 transition";
                tabC.className = "flex-1 py-2 text-sm font-bold rounded-lg text-gray-700 transition";
            }
            updateFormUI();
        }

        function toggleMode(mode) {
            currentMode = mode;
            showStatus('', 'hidden');
            document.getElementById('otpContainer').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            updateFormUI();
        }

        function switchToForgotPassMode() {
            toggleMode('forgot');
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "🙈";
            } else {
                input.type = "password";
                icon.innerText = "👁️";
            }
        }

        function updateFormUI() {
            const title = document.getElementById('formTitle');
            const sub = document.getElementById('formSub');
            const btn = document.getElementById('submitBtn');
            const toggleTxt = document.getElementById('toggleText');
            const workTypeContainer = document.getElementById('workTypeContainer');
            const emailContainer = document.getElementById('emailContainer');
            const passwordContainer = document.getElementById('passwordContainer');
            const confirmPasswordContainer = document.getElementById('confirmPasswordContainer');
            const forgotPassBtn = document.getElementById('forgotPassBtn');
            const passLabel = document.getElementById('passLabel');

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');

            let roleName = currentRole === 'customer' ? 'Customer' : 'Worker';

            if (currentMode === 'signup' && currentRole === 'worker') {
                workTypeContainer.classList.remove('hidden');
            } else {
                workTypeContainer.classList.add('hidden');
            }

            if (currentMode === 'signup') {
                title.innerText = roleName + " Signup";
                sub.innerText = "Create account using Email OTP & Password";
                btn.innerText = "Send OTP";
                
                emailContainer.classList.remove('hidden');
                passwordContainer.classList.remove('hidden');
                confirmPasswordContainer.classList.remove('hidden');
                forgotPassBtn.classList.add('hidden');

                emailInput.required = true;
                passwordInput.required = true;
                confirmPasswordInput.required = true;
                passLabel.innerText = "Password:";

                btn.className = currentRole === 'customer' ? "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition" : "w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-xl shadow-lg transition";
                toggleTxt.innerHTML = `Already have an account? <a href="#" onclick="toggleMode('signin')" class="text-blue-600 font-bold hover:underline">Sign In</a>`;

            } else if (currentMode === 'signin') {
                title.innerText = roleName + " Sign In";
                sub.innerText = "Enter Mobile & Password to login";
                btn.innerText = "Sign In Direct";

                emailContainer.classList.add('hidden');
                passwordContainer.classList.remove('hidden');
                confirmPasswordContainer.classList.add('hidden');
                forgotPassBtn.classList.remove('hidden');

                emailInput.required = false;
                passwordInput.required = true;
                confirmPasswordInput.required = false;
                passLabel.innerText = "Password:";

                btn.className = currentRole === 'customer' ? "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition" : "w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-xl shadow-lg transition";
                toggleTxt.innerHTML = `Don't have an account? <a href="#" onclick="toggleMode('signup')" class="text-blue-600 font-bold hover:underline">Sign Up</a>`;

            } else if (currentMode === 'forgot') {
                title.innerText = "Reset Password";
                sub.innerText = "Verify Mobile & OTP to set new password";
                btn.innerText = "Send Reset OTP";

                emailContainer.classList.add('hidden');
                passwordContainer.classList.remove('hidden');
                confirmPasswordContainer.classList.remove('hidden');
                forgotPassBtn.classList.add('hidden');

                emailInput.required = false;
                passwordInput.required = true;
                confirmPasswordInput.required = true;
                passLabel.innerText = "New Password:";

                btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-lg transition";
                toggleTxt.innerHTML = `Remembered Password? <a href="#" onclick="toggleMode('signin')" class="text-blue-600 font-bold hover:underline">Back to Sign In</a>`;
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            if (type === 'hidden') {
                el.classList.add('hidden');
                return;
            }
            el.innerText = msg;
            el.className = "mb-4 p-3 rounded-xl text-center text-xs font-semibold " + 
                (type === 'success' ? "bg-green-100 border border-green-400 text-green-700" : 
                 type === 'error' ? "bg-red-100 border border-red-400 text-red-700" : "bg-blue-100 border border-blue-400 text-blue-700");
            el.classList.remove('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            let mobile = document.getElementById('mobile').value.trim();
            let password = document.getElementById('password').value.trim();
            let savedUserJson = localStorage.getItem('gharkam_user_' + mobile);

            if (currentMode === 'signup') {
                let confirmPassword = document.getElementById('confirmPassword').value.trim();

                if (password !== confirmPassword) {
                    showStatus("❌ पासवर्ड जुळत नाहीत! कृपया दोन्ही पासवर्ड तपासा.", "error");
                    return;
                }

                if (savedUserJson) {
                    showStatus("हा मोबाईल नंबर आधीपासून रजिस्टर आहे! कृपया Direct Sign In करा.", "error");
                    return;
                }

                let email = document.getElementById('email').value.trim();
                let selectedWorkType = (currentRole === 'worker') ? document.getElementById('workType').value : null;

                pendingUserData = { 
                    mobile, email, password, role: currentRole, balance: 50, 
                    workType: selectedWorkType 
                };

                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
                sendEmailOTP(email, generatedOTP);

            } else if (currentMode === 'signin') {
                if (!savedUserJson) {
                    showStatus("Account सापडले नाही! कृपया आधी Sign Up करा.", "error");
                    return;
                }

                let savedUser = JSON.parse(savedUserJson);

                if (savedUser.password === password) {
                    savedUser.role = currentRole;
                    localStorage.setItem('current_user_session', JSON.stringify(savedUser));

                    showStatus("🎉 लॉगिन यशस्वी झाले! Redirecting...", "success");

                    setTimeout(() => {
                        if (currentRole === 'customer') {
                            window.location.href = "./customer.html";
                        } else if (currentRole === 'worker') {
                            window.location.href = "./worker.html";
                        }
                    }, 800);
                } else {
                    showStatus("❌ चुकीचा पासवर्ड! कृपया पुन्हा प्रयत्न करा.", "error");
                }

            } else if (currentMode === 'forgot') {
                if (!savedUserJson) {
                    showStatus("हा मोबाईल नंबर रजिस्टर नाही! कृपया आधी Sign Up करा.", "error");
                    return;
                }

                let confirmPassword = document.getElementById('confirmPassword').value.trim();
                if (password !== confirmPassword) {
                    showStatus("❌ पासवर्ड जुळत नाहीत! कृपया दोन्ही पासवर्ड तपासा.", "error");
                    return;
                }

                let savedUser = JSON.parse(savedUserJson);
                pendingUserData = savedUser;
                pendingUserData.newPassword = password; // नवीन पासवर्ड तात्पुरता स्टोअर करणे

                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
                sendEmailOTP(savedUser.email, generatedOTP);
            }
        }

        function sendEmailOTP(email, otp) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Sending OTP...";

            showStatus("⏳ Sending OTP to " + email + "...", "info");

            const serviceID = 'service_lst67g7';
            const templateID = 'template_ope5xzi';

            const templateParams = {
                to_email: email,
                email: email,
                user_email: email,
                otp_code: otp,
                message: "Your Gharkam.com OTP Code is: " + otp
            };

            emailjs.send(serviceID, templateID, templateParams)
                .then(() => {
                    showStatus("📩 OTP पाठवला आहे! कृपया Inbox किंवा Spam folder तपासा.", "success");
                    document.getElementById('otpContainer').classList.remove('hidden');
                    btn.classList.add('hidden');
                    btn.disabled = false;
                })
                .catch((err) => {
                    console.error("EmailJS Error:", err);
                    showStatus("❌ Email पाठवणे अपयशी ठरले. EmailJS Template तपासा.", "error");
                    btn.disabled = false;
                    btn.innerText = "Send OTP";
                });
        }

        function resendOTP() {
            let email = pendingUserData ? pendingUserData.email : document.getElementById('email').value.trim();
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            sendEmailOTP(email, generatedOTP);
        }

        function verifyOTPAndRegister(event) {
            if(event) event.preventDefault();
            
            let userEnteredOTP = document.getElementById('otpInput').value.trim();
            const verifyBtn = document.getElementById('verifyBtn');

            if (userEnteredOTP === generatedOTP) {
                verifyBtn.disabled = true;
                verifyBtn.innerText = "Verifying...";

                if (currentMode === 'signup') {
                    localStorage.setItem('gharkam_user_' + pendingUserData.mobile, JSON.stringify(pendingUserData));
                    localStorage.setItem('current_user_session', JSON.stringify(pendingUserData));
                    showStatus("🎉 अकाऊंट यशस्वीरीत्या तयार झाले! Redirecting...", "success");

                } else if (currentMode === 'forgot') {
                    pendingUserData.password = pendingUserData.newPassword;
                    delete pendingUserData.newPassword;
                    localStorage.setItem('gharkam_user_' + pendingUserData.mobile, JSON.stringify(pendingUserData));
                    showStatus("🎉 पासवर्ड यशस्वीरीत्या बदलला! आता लॉगिन करा.", "success");
                    
                    setTimeout(() => {
                        toggleMode('signin');
                    }, 1500);
                    return;
                }

                setTimeout(() => {
                    if (currentRole === 'customer') {
                        window.location.href = "./customer.html";
                    } else if (currentRole === 'worker') {
                        window.location.href = "./worker.html";
                    }
                }, 800);
            } else {
                showStatus("❌ चुकीचा OTP! अचूक कोड टाका.", "error");
            }
        }
    </script>
</body>
</html>
