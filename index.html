<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharmitra.online - Secure Login & Signup</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("PfAaODZ_GPiBPHvOi"); 
        })();
    </script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #1e1b4b, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .custom-input {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(243, 244, 246, 0.8);
        }

        .custom-input:focus {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.25);
        }

        .btn-glow-blue {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.3s ease;
        }

        .btn-glow-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.7);
        }

        .btn-glow-yellow {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 8px 20px -4px rgba(234, 179, 8, 0.4);
            transition: all 0.3s ease;
        }

        .btn-glow-yellow:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(234, 179, 8, 0.6);
        }

        .tab-active-customer {
            background: #2563eb !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .tab-active-worker {
            background: #eab308 !important;
            color: #0f172a !important;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800 antialiased">

    <!-- Header -->
    <header class="w-full py-4 px-6 flex justify-between items-center glass-header sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-white/90 p-2.5 rounded-2xl shadow-md font-extrabold text-blue-600 text-xl border border-white/50">🏠</div>
            <div>
                <h1 class="text-white text-2xl font-black tracking-wide">GHARMITRA<span class="text-yellow-400">.online</span></h1>
                <p class="text-[11px] font-medium text-blue-200 tracking-wider">PUNE CITY SERVICES</p>
            </div>
        </div>
        <div>
            <span id="location-status" class="text-xs bg-gradient-to-r from-yellow-400 to-amber-500 text-gray-900 px-3.5 py-1.5 rounded-full font-bold shadow-lg flex items-center gap-1">
                📍 Pune Verified
            </span>
        </div>
    </header>

    <!-- Main Card -->
    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full glass-card p-8 rounded-3xl transition-all duration-300">
            
            <!-- Role Selector Tabs -->
            <div class="flex mb-6 bg-gray-200/70 p-1.5 rounded-2xl backdrop-blur-sm border border-gray-300/50">
                <button onclick="setRole('customer')" id="tabCustomer" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-300 tab-active-customer">Customer</button>
                <button onclick="setRole('worker')" id="tabWorker" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-gray-600 hover:text-gray-900 transition-all duration-300">Worker</button>
            </div>

            <!-- Title -->
            <div class="text-center mb-6">
                <h2 id="formTitle" class="text-2xl font-black text-gray-800 tracking-tight">Customer Signup</h2>
                <p id="formSub" class="text-xs font-medium text-gray-500 mt-1">Create account using Email OTP</p>
            </div>

            <!-- Status Msg -->
            <div id="statusMsg" class="hidden mb-5 p-3.5 rounded-2xl text-center text-xs font-bold transition-all"></div>

            <!-- Form -->
            <form id="authForm" onsubmit="handleSubmit(event)" class="space-y-4">
                
                <div id="fullNameContainer">
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter full name" class="w-full p-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium custom-input">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required class="w-full p-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium custom-input">
                </div>

                <div id="emailContainer">
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Email ID</label>
                    <input type="email" id="email" placeholder="E.g., name@gmail.com" class="w-full p-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium custom-input">
                </div>

                <div id="passwordContainer">
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Password</label>
                    <input type="password" id="password" placeholder="Enter password" minlength="6" class="w-full p-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium custom-input">
                </div>

                <div id="workTypeContainer" class="hidden">
                    <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wider">Work Expertise</label>
                    <select id="workType" class="w-full p-3.5 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-yellow-500 outline-none text-sm font-medium bg-white custom-input">
                        <option value="Cleaning">🧹 Cleaning</option>
                        <option value="Electrician">⚡ Electrician</option>
                        <option value="Plumbing">🪠 Plumbing</option>
                        <option value="Painting">🎨 Painting</option>
                        <option value="Carpenter">🪚 Carpenter</option>
                        <option value="AC Repair">❄️ AC Repair</option>
                        <option value="Appliance Repair">🔌 Appliance Repair</option>
                        <option value="Masonry">🧱 Masonry</option>
                        <option value="Locksmith">🔑 Locksmith</option>
                        <option value="Pest Control">🦟 Pest Control</option>
                        <option value="Gardening">🌿 Gardening</option>
                        <option value="Glass & Aluminium">🪟 Glass & Aluminium</option>
                        <option value="TV & DTH">📺 TV & DTH</option>
                        <option value="Moving & Shifting">📦 Moving & Shifting</option>
                        <option value="Bathroom Services">🚿 Bathroom Services</option>
                    </select>
                </div>

                <div id="forgotPasswordLinkContainer" class="hidden text-right">
                    <button type="button" onclick="showForgotPasswordUI()" class="text-xs text-blue-600 font-bold hover:underline">Forgot Password?</button>
                </div>

                <button type="submit" id="submitBtn" class="w-full text-white font-bold py-3.5 rounded-2xl transition duration-300 btn-glow-blue tracking-wide text-sm mt-2">
                    Send OTP & Verify
                </button>

                <!-- OTP UI -->
                <div id="otpContainer" class="hidden space-y-3 pt-3 border-t border-gray-200">
                    <label id="otpLabel" class="block text-xs font-bold text-blue-600 uppercase tracking-wider">Enter OTP sent to Email:</label>
                    <div class="flex space-x-2">
                        <input type="text" id="otpInput" placeholder="6-digit OTP" class="flex-1 p-3 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono text-center tracking-widest custom-input">
                        <button type="button" id="verifyOtpBtn" onclick="verifyOTPAndRegister(event)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 rounded-2xl text-xs transition shadow-lg">Verify</button>
                    </div>

                    <div class="flex justify-between items-center text-xs pt-1">
                        <button type="button" onclick="resendOTP()" id="resendBtn" class="text-blue-600 hover:underline font-bold">🔄 Resend OTP</button>
                    </div>
                </div>

                <!-- Reset Password UI -->
                <div id="newPasswordContainer" class="hidden space-y-3 pt-3 border-t border-gray-200">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">New Password:</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" class="w-full p-3.5 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm custom-input">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Confirm New Password:</label>
                        <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" minlength="6" class="w-full p-3.5 border rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none text-sm custom-input">
                    </div>
                    <button type="button" onclick="updateNewPassword()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition">
                        Update Password
                    </button>
                </div>
            </form>

            <div class="text-center mt-6">
                <p id="toggleText" class="text-xs font-semibold text-gray-600">
                    Already have an account? <a href="#" onclick="toggleMode()" class="text-blue-600 font-extrabold hover:underline">Sign In</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-blue-200/80 text-xs font-medium tracking-wide">
        &copy; 2026 Gharmitra.online | Pune City
    </footer>

    <!-- Script JavaScript (Existing Logic Intact) -->
    <script>
        let currentRole = 'customer'; 
        let isSignupMode = true;      
        let isForgotPasswordMode = false;
        let generatedOTP = null;
        let pendingUserData = null;
        let resetPasswordMobile = null;

        function setRole(role) {
            currentRole = role;
            const tabC = document.getElementById('tabCustomer');
            const tabW = document.getElementById('tabWorker');

            if (role === 'customer') {
                tabC.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-300 tab-active-customer";
                tabW.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-gray-600 hover:text-gray-900 transition-all duration-300";
            } else {
                tabW.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-300 tab-active-worker";
                tabC.className = "flex-1 py-2.5 text-xs font-bold rounded-xl text-gray-600 hover:text-gray-900 transition-all duration-300";
            }
            if(!isForgotPasswordMode) updateFormUI();
        }

        function toggleMode() {
            isSignupMode = !isSignupMode;
            isForgotPasswordMode = false;
            showStatus('', 'hidden');
            document.getElementById('otpContainer').classList.add('hidden');
            document.getElementById('newPasswordContainer').classList.add('hidden');
            document.getElementById('submitBtn').classList.remove('hidden');
            updateFormUI();
        }

        function updateFormUI() {
            const title = document.getElementById('formTitle');
            const sub = document.getElementById('formSub');
            const btn = document.getElementById('submitBtn');
            const toggleTxt = document.getElementById('toggleText');
            const workTypeContainer = document.getElementById('workTypeContainer');
            const fullNameContainer = document.getElementById('fullNameContainer');
            const fullNameInput = document.getElementById('fullName');
            const emailContainer = document.getElementById('emailContainer');
            const emailInput = document.getElementById('email');
            const passwordContainer = document.getElementById('passwordContainer');
            const passwordInput = document.getElementById('password');
            const forgotLinkContainer = document.getElementById('forgotPasswordLinkContainer');

            let roleName = currentRole === 'customer' ? 'Customer' : 'Worker';

            if (isSignupMode && currentRole === 'worker') {
                workTypeContainer.classList.remove('hidden');
            } else {
                workTypeContainer.classList.add('hidden');
            }

            if (isSignupMode) {
                title.innerText = roleName + " Signup";
                sub.innerText = "Create account using Email OTP & Password";
                btn.innerText = "Send OTP & Verify";
                fullNameContainer.classList.remove('hidden');
                fullNameInput.required = true;
                emailContainer.classList.remove('hidden');
                emailInput.required = true;
                passwordContainer.classList.remove('hidden');
                passwordInput.required = true;
                forgotLinkContainer.classList.add('hidden');
                btn.className = currentRole === 'customer' ? "w-full text-white font-bold py-3.5 rounded-2xl transition duration-300 btn-glow-blue tracking-wide text-sm mt-2" : "w-full text-gray-900 font-bold py-3.5 rounded-2xl transition duration-300 btn-glow-yellow tracking-wide text-sm mt-2";
                toggleTxt.innerHTML = `Already have an account? <a href="#" onclick="toggleMode()" class="text-blue-600 font-extrabold hover:underline">Sign In</a>`;
            } else {
                title.innerText = roleName + " Sign In";
                sub.innerText = "Enter Mobile & Password to Sign In";
                btn.innerText = "Sign In";
                fullNameContainer.classList.add('hidden');
                fullNameInput.required = false;
                emailContainer.classList.add('hidden'); 
                emailInput.required = false;
                passwordContainer.classList.remove('hidden');
                passwordInput.required = true;
                forgotLinkContainer.classList.remove('hidden');
                btn.className = currentRole === 'customer' ? "w-full text-white font-bold py-3.5 rounded-2xl transition duration-300 btn-glow-blue tracking-wide text-sm mt-2" : "w-full text-gray-900 font-bold py-3.5 rounded-2xl transition duration-300 btn-glow-yellow tracking-wide text-sm mt-2";
                toggleTxt.innerHTML = `Don't have an account? <a href="#" onclick="toggleMode()" class="text-blue-600 font-extrabold hover:underline">Sign Up</a>`;
            }
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            if (type === 'hidden') {
                el.classList.add('hidden');
                return;
            }
            el.innerText = msg;
            el.className = "mb-5 p-3.5 rounded-2xl text-center text-xs font-bold transition-all " + 
                (type === 'success' ? "bg-emerald-100 border border-emerald-300 text-emerald-800" : 
                 type === 'error' ? "bg-rose-100 border border-rose-300 text-rose-800" : "bg-blue-100 border border-blue-300 text-blue-800");
            el.classList.remove('hidden');
        }

        function showForgotPasswordUI() {
            let mobile = document.getElementById('mobile').value.trim();
            if (!mobile || mobile.length !== 10) {
                showStatus("❌ Krupaya adhi barobar 10-digit Mobile Number taka!", "error");
                return;
            }

            let savedUserJson = localStorage.getItem('gharmitra_user_' + mobile) || localStorage.getItem('gharkam_user_' + mobile);
            if (!savedUserJson) {
                showStatus("❌ Ha mobile number registered nahi ahe! Adhi Signup kara.", "error");
                return;
            }

            let savedUser = JSON.parse(savedUserJson);
            resetPasswordMobile = mobile;
            isForgotPasswordMode = true;

            document.getElementById('formTitle').innerText = "Reset Password";
            document.getElementById('formSub').innerText = "OTP will be sent to: " + savedUser.email;
            document.getElementById('fullNameContainer').classList.add('hidden');
            document.getElementById('email').value = savedUser.email;
            document.getElementById('emailContainer').classList.remove('hidden');
            document.getElementById('email').readOnly = true;
            document.getElementById('passwordContainer').classList.add('hidden');
            document.getElementById('forgotPasswordLinkContainer').classList.add('hidden');
            document.getElementById('submitBtn').classList.add('hidden');

            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            sendEmailOTPForReset(savedUser.email, generatedOTP);
        }

        function sendEmailOTPForReset(email, otp) {
            showStatus("⏳ Sending Password Reset OTP to " + email + "...", "info");

            const serviceID = 'service_lst67g7';
            const templateID = 'template_ope5xzi';

            const templateParams = {
                to_email: email,
                email: email,
                user_email: email,
                otp_code: otp,
                message: "Your Gharmitra.online Password Reset OTP Code is: " + otp
            };

            emailjs.send(serviceID, templateID, templateParams)
                .then(() => {
                    showStatus("📩 Reset OTP pathavla ahe! Krupaya check kara.", "success");
                    document.getElementById('otpContainer').classList.remove('hidden');
                    document.getElementById('otpLabel').innerText = "Enter Reset OTP sent to Email:";
                    document.getElementById('verifyOtpBtn').setAttribute('onclick', 'verifyResetOTP(event)');
                    document.getElementById('verifyOtpBtn').innerText = "Verify OTP";
                })
                .catch((err) => {
                    console.error("EmailJS Error:", err);
                    showStatus("❌ Email send fails.", "error");
                });
        }

        function verifyResetOTP(event) {
            if(event) event.preventDefault();
            let userEnteredOTP = document.getElementById('otpInput').value.trim();

            if (userEnteredOTP === generatedOTP) {
                showStatus("✅ OTP verified successfully! Now enter your new password.", "success");
                document.getElementById('otpContainer').classList.add('hidden');
                document.getElementById('newPasswordContainer').classList.remove('hidden');
            } else {
                showStatus("❌ चुकीचा OTP! Correct code taka.", "error");
            }
        }

        function updateNewPassword() {
            let newPass = document.getElementById('newPassword').value.trim();
            let confirmPass = document.getElementById('confirmNewPassword').value.trim();

            if (!newPass || newPass.length < 6) {
                showStatus("❌ Password kamit kami 6 anki asla pahije.", "error");
                return;
            }

            if (newPass !== confirmPass) {
                showStatus("❌ New Password and Confirm Password match hot nahi!", "error");
                return;
            }

            let savedUserJson = localStorage.getItem('gharmitra_user_' + resetPasswordMobile) || localStorage.getItem('gharkam_user_' + resetPasswordMobile);
            if (savedUserJson) {
                let savedUser = JSON.parse(savedUserJson);
                savedUser.password = newPass;
                localStorage.setItem('gharmitra_user_' + resetPasswordMobile, JSON.stringify(savedUser));

                showStatus("🎉 Password successfully changed! Now Sign In.", "success");
                
                setTimeout(() => {
                    isForgotPasswordMode = false;
                    document.getElementById('newPasswordContainer').classList.add('hidden');
                    document.getElementById('email').readOnly = false;
                    document.getElementById('email').value = "";
                    document.getElementById('password').value = "";
                    toggleMode(); 
                }, 1500);
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            let mobile = document.getElementById('mobile').value.trim();
            let password = document.getElementById('password').value.trim();
            let savedUserJson = localStorage.getItem('gharmitra_user_' + mobile) || localStorage.getItem('gharkam_user_' + mobile);

            if (isSignupMode) {
                let fullName = document.getElementById('fullName').value.trim();
                let email = document.getElementById('email').value.trim().toLowerCase();

                if (!fullName) {
                    showStatus("Krupaya purna nav taka!", "error");
                    return;
                }

                if (savedUserJson) {
                    showStatus("Ha mobile number registered ahe! Direct Sign In kara.", "error");
                    return;
                }

                let selectedWorkType = (currentRole === 'worker') ? document.getElementById('workType').value : null;

                pendingUserData = { 
                    fullName, name: fullName, mobile, email, password, role: currentRole, balance: 50, 
                    workType: selectedWorkType, service: selectedWorkType
                };

                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
                sendEmailOTP(email, generatedOTP);

            } else {
                if (!savedUserJson) {
                    showStatus("Your account is not available, please first signup.", "error");
                    return;
                }

                let savedUser = JSON.parse(savedUserJson);

                if (savedUser.password !== password) {
                    showStatus("❌ चुकीचा Password! Krupaya बरोबर पासवर्ड टाका.", "error");
                    return;
                }

                savedUser.role = currentRole;
                localStorage.setItem('current_user_session', JSON.stringify(savedUser));

                showStatus("🎉 Login Successful! Redirecting...", "success");

                setTimeout(() => {
                    redirectUser(currentRole);
                }, 800);
            }
        }

        function sendEmailOTP(email, otp) {
            showStatus("⏳ Sending OTP to " + email + "...", "info");

            const serviceID = 'service_lst67g7';
            const templateID = 'template_ope5xzi';

            const templateParams = {
                to_email: email,
                email: email,
                user_email: email,
                otp_code: otp,
                message: "Your Gharmitra.online OTP Code is: " + otp
            };

            emailjs.send(serviceID, templateID, templateParams)
                .then(() => {
                    showStatus("📩 OTP Pathavla ahe! Krupaya Inbox ki Spam folder check kara.", "success");
                    document.getElementById('otpContainer').classList.remove('hidden');
                    document.getElementById('submitBtn').classList.add('hidden');
                })
                .catch((err) => {
                    console.error("EmailJS Error:", err);
                    showStatus("❌ Email send fails. Re-check EmailJS Template.", "error");
                });
        }

        function resendOTP() {
            let email = document.getElementById('email').value.trim();
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            if(isForgotPasswordMode) {
                sendEmailOTPForReset(email, generatedOTP);
            } else {
                sendEmailOTP(email, generatedOTP);
            }
        }

        function verifyOTPAndRegister(event) {
            if(event) event.preventDefault();
            
            let userEnteredOTP = document.getElementById('otpInput').value.trim();

            if (userEnteredOTP === generatedOTP) {
                localStorage.setItem('gharmitra_user_' + pendingUserData.mobile, JSON.stringify(pendingUserData));
                localStorage.setItem('current_user_session', JSON.stringify(pendingUserData));

                showStatus("🎉 Signup Successful! Redirecting...", "success");

                setTimeout(() => {
                    redirectUser(currentRole);
                }, 800);
            } else {
                showStatus("❌ चुकीचा OTP! Correct code taka.", "error");
            }
        }

        function redirectUser(role) {
            if (role === 'customer') {
                window.location.href = "./customer.html";
            } else if (role === 'worker') {
                window.location.href = "./worker.html";
            }
        }
    </script>
</body>
</html>
